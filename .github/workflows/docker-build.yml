name: Build and Run Site Checker

on:
  push:
    branches: [main]

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t site-checker ./docker-practice

      - name: Run the container
        run: docker run site-checker
